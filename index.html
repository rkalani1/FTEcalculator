<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102f42">
    <title>Faculty FTE Calculator</title>
    <script>
        function calculateFTE() {
            const strokeShifts = parseFloat(document.getElementById('strokeShifts').value) || 0;
            const clinicHalfDays = parseFloat(document.getElementById('clinicHalfDays').value) || 0;
            const hmcWeeks = parseFloat(document.getElementById('hmcWeeks').value) || 0;
            const uwmcMLWeeks = parseFloat(document.getElementById('uwmcMLWeeks').value) || 0;
            const uwmcNWWeeks = parseFloat(document.getElementById('uwmcNWWeeks').value) || 0;
            const protectedTime = parseFloat(document.getElementById('protectedTime').value) || 0;
            const researchTime = parseFloat(document.getElementById('researchTime').value) || 0;

            const strokeFTE = (strokeShifts / 14) * 7;
            const clinicFTE = clinicHalfDays * 10;
            const hmcFTE = hmcWeeks * 3;
            const uwmcMLFTE = uwmcMLWeeks * 2.5;
            const uwmcNWFTE = uwmcNWWeeks * 4;

            const totalFTE = strokeFTE + clinicFTE + hmcFTE + uwmcMLFTE + uwmcNWFTE + protectedTime + researchTime;

            document.getElementById('result').innerText = "Total FTE: " + totalFTE.toFixed(2) + "%";
        }
    </script>
    <style>
        :root {
            color-scheme: light;
            --ink: #102f42;
            --ink-soft: #4f6674;
            --paper: #f8fbfa;
            --surface: rgba(255, 255, 255, 0.94);
            --line: #d7e4e2;
            --teal: #087f79;
            --teal-dark: #08645f;
            --gold: #e2a83a;
            --shadow: 0 26px 70px rgba(8, 35, 48, 0.18);
        }

        * { box-sizing: border-box; }

        html { min-height: 100%; }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(circle at 9% 10%, rgba(226, 168, 58, 0.22), transparent 25rem),
                radial-gradient(circle at 92% 88%, rgba(8, 127, 121, 0.24), transparent 30rem),
                linear-gradient(145deg, #0d2b3d 0%, #16495a 53%, #0b6866 100%);
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: clamp(1rem, 4vw, 3.5rem);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.28;
            background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
            background-size: 34px 34px;
            mask-image: linear-gradient(to bottom, black, transparent 75%);
        }

        .app-shell {
            position: relative;
            width: min(100%, 960px);
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,.65);
            border-radius: 28px;
            box-shadow: var(--shadow);
            overflow: hidden;
            backdrop-filter: blur(18px);
        }

        .app-header {
            position: relative;
            padding: clamp(1.6rem, 4vw, 3rem);
            color: white;
            background: linear-gradient(120deg, var(--ink) 0%, #164c5d 72%, #0c6966 100%);
        }

        .app-header::after {
            content: "";
            position: absolute;
            width: 13rem;
            height: 13rem;
            right: -4rem;
            top: -7rem;
            border: 1px solid rgba(255,255,255,.22);
            border-radius: 50%;
            box-shadow: 0 0 0 2.7rem rgba(255,255,255,.04), 0 0 0 5.4rem rgba(255,255,255,.025);
        }

        h1 {
            position: relative;
            z-index: 1;
            max-width: 14ch;
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 600;
            line-height: 0.98;
            letter-spacing: -0.035em;
            text-wrap: balance;
        }

        form {
            padding: clamp(1.25rem, 4vw, 3rem);
        }

        .fields-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
        }

        .field {
            min-width: 0;
            padding: 1rem;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 16px;
            transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
        }

        .field:focus-within {
            border-color: var(--teal);
            box-shadow: 0 0 0 4px rgba(8, 127, 121, 0.12);
            transform: translateY(-1px);
        }

        label {
            display: block;
            min-height: 2.8em;
            margin-bottom: .55rem;
            color: var(--ink-soft);
            font-size: .88rem;
            font-weight: 750;
            line-height: 1.35;
            letter-spacing: .01em;
        }

        input {
            width: 100%;
            min-height: 48px;
            margin: 0;
            padding: .72rem .85rem;
            color: var(--ink);
            background: white;
            border: 1px solid #c9d9d7;
            border-radius: 10px;
            font: inherit;
            font-size: 1rem;
        }

        input:focus { outline: none; }

        .calculate-button {
            width: 100%;
            min-height: 54px;
            margin-top: 1.25rem;
            padding: .85rem 1.25rem;
            color: white;
            background: linear-gradient(135deg, var(--teal), var(--teal-dark));
            border: 0;
            border-radius: 13px;
            box-shadow: 0 10px 24px rgba(8, 127, 121, .23);
            font: inherit;
            font-weight: 800;
            letter-spacing: .01em;
            cursor: pointer;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .calculate-button:hover {
            box-shadow: 0 14px 28px rgba(8, 127, 121, .3);
            filter: saturate(1.08);
            transform: translateY(-2px);
        }

        .calculate-button:active { transform: translateY(0); }

        .calculate-button:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 3px;
        }

        #result {
            margin: 1.25rem 0 0;
            padding: 1.15rem 1.25rem;
            color: white;
            background: var(--ink);
            border-left: 5px solid var(--gold);
            border-radius: 12px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.2rem, 3vw, 1.55rem);
            line-height: 1.25;
        }

        #result:empty { display: none; }

        @media (max-width: 680px) {
            body { padding: .75rem; }
            .app-shell { border-radius: 20px; }
            .fields-grid { grid-template-columns: 1fr; }
            label { min-height: auto; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <h1>Faculty FTE Calculator</h1>
        </header>
        <form onsubmit="event.preventDefault(); calculateFTE()">
            <div class="fields-grid">
                <div class="field">
                    <label for="strokeShifts">Stroke/Telestroke Shifts (12-hour each): </label>
                    <input type="number" id="strokeShifts" placeholder="# shifts">
                </div>
                <div class="field">
                    <label for="clinicHalfDays">Clinic (½-days per week): </label>
                    <input type="number" id="clinicHalfDays" placeholder="# half-days">
                </div>
                <div class="field">
                    <label for="hmcWeeks">HMC Inpatient Weeks: </label>
                    <input type="number" id="hmcWeeks" placeholder="# weeks">
                </div>
                <div class="field">
                    <label for="uwmcMLWeeks">UWMC-ML Inpatient Weeks: </label>
                    <input type="number" id="uwmcMLWeeks" placeholder="# weeks">
                </div>
                <div class="field">
                    <label for="uwmcNWWeeks">UWMC-NW Inpatient Weeks: </label>
                    <input type="number" id="uwmcNWWeeks" placeholder="# weeks">
                </div>
                <div class="field">
                    <label for="protectedTime">Protected Time (%): </label>
                    <input type="number" id="protectedTime" placeholder="e.g., 20">
                </div>
                <div class="field">
                    <label for="researchTime">Research Time (%): </label>
                    <input type="number" id="researchTime" placeholder="e.g., 30">
                </div>
            </div>
            <button class="calculate-button" type="submit">Calculate FTE</button>
            <h3 id="result" aria-live="polite" aria-atomic="true"></h3>
        </form>
    </main>
</body>
</html>
